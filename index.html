<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#7a5230" />
    <meta name="description" content="Dessine des motifs de vignes et arabesques procéduraux, exportables en SVG pour la découpe CNC/laser." />
    <title>Vignes &amp; Arabesques</title>
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="toolbar">
        <h1>Vignes &amp; Arabesques</h1>
        <div class="controls">
          <!-- Mode focus volutes (temporaire, réversible — retirer les `hidden` ci-dessous pour
               revenir à la barre d'outils complète) : seul le mode Libre reste utilisable, donc
               plus besoin d'un sélecteur ; Points/Masque et leurs boutons associés sont masqués. -->
          <div class="mode-toggle" role="group" aria-label="Mode de tracé" hidden>
            <button id="mode-freehand" class="mode-button active">Libre</button>
            <button id="mode-points" class="mode-button">Points</button>
            <button id="mode-mask" class="mode-button">Masque</button>
          </div>
          <button id="finish-points" hidden>Terminer le tracé</button>
          <button id="finish-mask" hidden>Terminer le masque</button>
          <button id="clear-mask" hidden>Effacer le masque</button>
          <!-- Mode focus volutes : l'habillage par motifs n'est pas la priorité pour l'instant. -->
          <fieldset class="motif-sequence" hidden>
            <legend>Motifs (ordre, échelle, jitter)</legend>
            <!-- Rempli dynamiquement par main.ts à partir du registre assets/motifs.ts (motifs
                 internes + tout .svg déposé dans assets/motifs/) — voir docs/how-to/ajouter-un-motif.md. -->
            <ol id="motif-list"></ol>
          </fieldset>
          <label>
            Densité des points
            <input id="density" type="range" min="0" max="100" value="55" step="1" />
          </label>
          <!-- Mode focus volutes : espacement du brush de motifs, hors sujet pour l'instant. -->
          <label hidden>
            Espacement
            <input id="spacing" type="range" min="8" max="60" value="40" step="1" />
          </label>
          <label>
            Épaisseur tige
            <input id="thickness" type="range" min="1" max="20" value="7" step="1" />
          </label>
          <div class="undo-redo" role="group" aria-label="Annuler / rétablir">
            <button id="undo" title="Annuler (Ctrl+Z)" aria-label="Annuler">↶</button>
            <button id="redo" title="Rétablir (Ctrl+Y)" aria-label="Rétablir">↷</button>
          </div>
          <fieldset class="auto-branch-params">
            <legend>Volutes auto</legend>
            <label>
              Longueur
              <input id="auto-branch-length" type="range" min="20" max="200" value="90" step="1" />
            </label>
            <label>
              Resserrement
              <input id="auto-branch-growth-rate" type="range" min="0.1" max="2" value="0.7" step="0.01" />
            </label>
            <label>
              Progressivité
              <input id="auto-branch-curvature-exponent" type="range" min="1" max="8" value="4" step="0.1" />
            </label>
            <label>
              Décroissance
              <input id="auto-branch-size-decay" type="range" min="0.5" max="0.95" value="0.85" step="0.01" />
            </label>
            <label>
              Récursion
              <input id="auto-branch-recursion" type="range" min="0" max="3" value="0" step="1" />
            </label>
          </fieldset>
          <button id="auto-branch" title="Régénère les volutes de la liane sélectionnée — les nouvelles lianes tracées en obtiennent déjà automatiquement">Volutes auto</button>
          <button id="clear">Effacer</button>
          <button id="export">Exporter SVG</button>
        </div>
      </header>
      <main id="canvas-wrap">
        <svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
