<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#7a5230" />
    <meta name="description" content="Dessine des motifs de vignes et arabesques procéduraux, exportables en SVG pour la découpe CNC/laser." />
    <title>Vignes &amp; Arabesques</title>
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="toolbar">
        <h1>Vignes &amp; Arabesques</h1>
        <div class="controls">
          <div class="mode-toggle" role="group" aria-label="Mode de tracé">
            <button id="mode-freehand" class="mode-button active">Libre</button>
            <button id="mode-points" class="mode-button">Points</button>
            <button id="mode-mask" class="mode-button">Masque</button>
          </div>
          <button id="finish-points" hidden>Terminer le tracé</button>
          <button id="finish-mask" hidden>Terminer le masque</button>
          <button id="clear-mask">Effacer le masque</button>
          <fieldset class="motif-sequence">
            <legend>Motifs (ordre, échelle, jitter)</legend>
            <!-- Rempli dynamiquement par main.ts à partir du registre assets/motifs.ts (motifs
                 internes + tout .svg déposé dans assets/motifs/) — voir docs/how-to/ajouter-un-motif.md. -->
            <ol id="motif-list"></ol>
          </fieldset>
          <label>
            Densité des points
            <input id="density" type="range" min="0" max="100" value="55" step="1" />
          </label>
          <label>
            Espacement
            <input id="spacing" type="range" min="8" max="60" value="26" step="1" />
          </label>
          <label>
            Épaisseur tige
            <input id="thickness" type="range" min="1" max="20" value="7" step="1" />
          </label>
          <div class="undo-redo" role="group" aria-label="Annuler / rétablir">
            <button id="undo" title="Annuler (Ctrl+Z)" aria-label="Annuler">↶</button>
            <button id="redo" title="Rétablir (Ctrl+Y)" aria-label="Rétablir">↷</button>
          </div>
          <button id="clear">Effacer</button>
          <button id="export">Exporter SVG</button>
        </div>
      </header>
      <main id="canvas-wrap">
        <svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
