<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Vignes &amp; Arabesques</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="toolbar">
        <h1>Vignes &amp; Arabesques</h1>
        <div class="controls">
          <div class="mode-toggle" role="group" aria-label="Mode de tracé">
            <button id="mode-freehand" class="mode-button active">Libre</button>
            <button id="mode-points" class="mode-button">Points</button>
            <button id="mode-mask" class="mode-button">Masque</button>
          </div>
          <button id="finish-points" hidden>Terminer le tracé</button>
          <button id="finish-mask" hidden>Terminer le masque</button>
          <button id="clear-mask">Effacer le masque</button>
          <fieldset class="motif-sequence">
            <legend>Motifs (ordre, échelle, jitter)</legend>
            <ol id="motif-list">
              <li class="motif-row" data-motif="leaf">
                <div class="motif-order">
                  <button type="button" class="motif-up" aria-label="Monter">↑</button>
                  <button type="button" class="motif-down" aria-label="Descendre">↓</button>
                </div>
                <label class="checkbox"><input type="checkbox" class="motif-active" checked /> Feuille</label>
                <label>Échelle<input type="range" class="motif-scale" min="4" max="40" value="16" step="1" /></label>
                <label>Jitter<input type="range" class="motif-jitter" min="0" max="100" value="20" step="1" /></label>
              </li>
              <li class="motif-row" data-motif="volute">
                <div class="motif-order">
                  <button type="button" class="motif-up" aria-label="Monter">↑</button>
                  <button type="button" class="motif-down" aria-label="Descendre">↓</button>
                </div>
                <label class="checkbox"><input type="checkbox" class="motif-active" checked /> Volute</label>
                <label>Échelle<input type="range" class="motif-scale" min="4" max="40" value="14" step="1" /></label>
                <label>Jitter<input type="range" class="motif-jitter" min="0" max="100" value="20" step="1" /></label>
              </li>
              <li class="motif-row" data-motif="flower">
                <div class="motif-order">
                  <button type="button" class="motif-up" aria-label="Monter">↑</button>
                  <button type="button" class="motif-down" aria-label="Descendre">↓</button>
                </div>
                <label class="checkbox"><input type="checkbox" class="motif-active" checked /> Fleur</label>
                <label>Échelle<input type="range" class="motif-scale" min="4" max="40" value="18" step="1" /></label>
                <label>Jitter<input type="range" class="motif-jitter" min="0" max="100" value="20" step="1" /></label>
              </li>
            </ol>
          </fieldset>
          <label>
            Densité des points
            <input id="density" type="range" min="0" max="100" value="55" step="1" />
          </label>
          <label>
            Espacement
            <input id="spacing" type="range" min="8" max="60" value="26" step="1" />
          </label>
          <label>
            Épaisseur tige
            <input id="thickness" type="range" min="1" max="20" value="7" step="1" />
          </label>
          <div class="undo-redo" role="group" aria-label="Annuler / rétablir">
            <button id="undo" title="Annuler (Ctrl+Z)" aria-label="Annuler">↶</button>
            <button id="redo" title="Rétablir (Ctrl+Y)" aria-label="Rétablir">↷</button>
          </div>
          <button id="clear">Effacer</button>
          <button id="export">Exporter SVG</button>
        </div>
      </header>
      <main id="canvas-wrap">
        <svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
